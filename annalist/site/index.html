<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2214%22%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('wiki-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  var o = null;
  try {
    var asked = new URLSearchParams(location.search).get('light');
    if (asked !== null) localStorage.setItem('wiki-light', asked);
    o = localStorage.getItem('wiki-light');
  } catch (e) {}
  if (o === 'a' || o === 'b' || o === 'c') document.documentElement.dataset.light = o;
})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <button class="iconbtn menubtn" id="menu" aria-label="Menu">&#9776;</button>
  <a class="brand" id="brand" data-go="home">Wiki</a>
  <div class="searchwrap"><input id="q" type="search" placeholder="Search names and aliases" autocomplete="off" aria-label="Search"><div class="results" id="results" role="listbox"></div></div>
  <div class="spoiler">
    <label for="n">I'm on chapter</label>
    <button class="iconbtn step" data-step="-1" aria-label="Previous chapter">&#8249;</button>
    <b id="nlab"></b>
    <button class="iconbtn step" data-step="1" aria-label="Next chapter">&#8250;</button>
    <input type="range" id="n" min="1" max="1" value="1">
    <span class="ctitle" id="ctitle"></span>
  </div>
  <button class="iconbtn themebtn" id="theme" aria-label="Toggle light and dark theme"><span class="sun">&#9728;</span><span class="moon">&#9790;</span></button>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"><p class="muted">Loading...</p></main>
</div>
<div class="hover" id="hover" role="tooltip"></div>
<script>
if (new URLSearchParams(location.search).has('light')) {
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:60;display:flex;gap:4px;padding:4px;border-radius:8px;background:#202122;font:12px system-ui;box-shadow:0 4px 16px #0004';
  [['', 'Current'], ['a', 'A plain white'], ['b', 'B soft neutral'], ['c', 'C reading']].forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p[1];
    b.style.cssText = 'border:0;border-radius:5px;padding:4px 9px;cursor:pointer;color:#fff;background:' + ((document.documentElement.dataset.light || '') === p[0] ? '#3366cc' : 'transparent');
    b.onclick = function () { location.search = '?light=' + p[0]; };
    bar.appendChild(b);
  });
  document.body.appendChild(bar);
}
</script>
<script src="app.js"></script>
</body>
</html>
